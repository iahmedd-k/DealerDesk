name: DealerDesk CI

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealerdesk
          POSTGRES_PASSWORD: dealerdesk_secret
          POSTGRES_DB: dealerdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linting
        run: |
          cd backend
          ruff check .

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://dealerdesk:dealerdesk_secret@localhost:5432/dealerdesk
          JWT_SECRET_KEY: test-only-jwt-secret-that-is-at-least-32-bytes
          CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
        run: |
          cd backend
          alembic upgrade head
          pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
